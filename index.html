<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C.O Games</title>

  <style>
    body {
      margin: 0;
      background: #171a21;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #101216;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .welcome {
      background: #202936;
      padding: 35px;
      border-radius: 10px;
      margin-bottom: 35px;
    }

    .welcome h1 {
      margin-top: 0;
    }

    .welcome p {
      color: #c7d5e0;
      line-height: 1.6;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .game {
      background: #20242c;
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: white;
      transition: 0.2s;
    }

    .game:hover {
      transform: translateY(-4px);
      background: #292e38;
    }

    .cover {
      height: 280px;
      background: #303b4d;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-weight: bold;
      padding: 15px;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin: 0 0 8px;
    }

    .info p {
      margin: 0;
      color: #9aa5b1;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #78838f;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">C.O Games</div>
  </header>

  <main>

    <section class="welcome">
      <h1>Добро пожаловать в C.O Games</h1>

      <p>
        Каталог компьютерных игр.
        Здесь можно узнавать об играх,
        смотреть скриншоты и трейлеры.
      </p>
    </section>

    <h2>Игры</h2>

    <div class="games">

      <a class="game" href="oblivion.html">

        <div class="cover">
          OBLIVION:<br>
          CLOSED FOREVER
        </div>

        <div class="info">
          <h3>Oblivion: Closed Forever</h3>
          <p>Хоррор • EverBright Industries</p>
        </div>

      </a>

    </div>

  </main>

  <footer>
    © 2026 C.O Games
  </footer>

</body>
</html>
